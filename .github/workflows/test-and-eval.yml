name: CS Agent QA & LLM Evals

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Deterministic API Tests
        run: pytest tests/test_api_deterministic.py -v

      - name: Run AI Guardrail & Security Tests
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || 'mock-key' }}
        run: pytest tests/test_security_guardrails.py -v

      - name: Run DeepEval Model Evaluations
        if: env.OPENAI_API_KEY != ''
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: pytest tests/test_llm_evals.py -v